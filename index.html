<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="bg-blob bg-blob--one" aria-hidden="true"></div>
<div class="bg-blob bg-blob--two" aria-hidden="true"></div>
<div class="weather-fx" aria-hidden="true"></div>
<div class="rain-layer" id="rain-layer" aria-hidden="true"></div>
<main class="card">
<h1>Weather Now</h1>
<p class="subtitle">Check the sky, anywhere.</p>
<form id="weather-form">
<input type="text" id="city-input" placeholder="Enter a city" aria-label="City" required />
<button type="submit">
Get Weather
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</form>
<div id="result"></div>
</main>
<p id="quote" class="quote"></p>
<script src="script.js"></script>
</body>
</html>
